<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="t-becas d-becas" font-family="Arial, Helvetica, sans-serif">
  <title id="t-becas">Becas y cupones</title>
  <desc id="d-becas">Diferencia entre beca asignada y cupón genérico, las tres respuestas posibles a una solicitud, y la regla de un solo uso.</desc>

  <rect width="720" height="1000" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">Becas y cupones</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#EF5554"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">Dos herramientas para el mismo problema: que el costo no deje a nadie afuera.</text>

  <!-- Comparación -->
  <g>
    <rect x="48" y="152" width="304" height="196" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="48" y="152" width="6" height="196" rx="3" fill="#161440"/>
    <text x="76" y="186" font-size="18" font-weight="bold" fill="#161440">Beca asignada</text>
    <text x="76" y="216" font-size="14" fill="#5B5975">A nombre de UNA persona</text>
    <text x="76" y="236" font-size="14" fill="#5B5975">y para un cobro concreto.</text>
    <text x="76" y="272" font-size="13" fill="#8B8AA0">Nace de una solicitud, o</text>
    <text x="76" y="292" font-size="13" fill="#8B8AA0">se crea desde Finanzas.</text>
    <text x="76" y="326" font-size="13" fill="#8B8AA0">La aplica el sistema.</text>
  </g>
  <g>
    <rect x="368" y="152" width="304" height="196" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="368" y="152" width="6" height="196" rx="3" fill="#70BDC2"/>
    <text x="396" y="186" font-size="18" font-weight="bold" fill="#161440">Cupón genérico</text>
    <text x="396" y="216" font-size="14" fill="#5B5975">Tiene un código y lo canjea</text>
    <text x="396" y="236" font-size="14" fill="#5B5975">quien lo tenga.</text>
    <text x="396" y="272" font-size="13" fill="#8B8AA0">Para campañas o para</text>
    <text x="396" y="292" font-size="13" fill="#8B8AA0">entregar en mano.</text>
    <text x="396" y="326" font-size="13" fill="#8B8AA0">Lo aplica la persona al pagar.</text>
  </g>

  <!-- Un solo uso -->
  <g>
    <rect x="48" y="376" width="624" height="122" rx="14" fill="#161440"/>
    <text x="76" y="408" font-size="12" font-weight="bold" fill="#70BDC2" letter-spacing="2">LA REGLA QUE NO SE PUEDE ROMPER</text>
    <text x="76" y="444" font-size="22" font-weight="bold" fill="#FFFFFF">Un solo uso. Los dos.</text>
    <text x="76" y="472" font-size="14" fill="#9FA8C7">Si dos personas canjean el mismo cupón al mismo tiempo, una lo logra y</text>
    <text x="76" y="490" font-size="14" fill="#9FA8C7">la otra recibe un error — nunca un descuento duplicado.</text>
  </g>

  <!-- Las tres respuestas -->
  <text x="48" y="546" font-size="12" font-weight="bold" fill="#8B8AA0" letter-spacing="2">LAS TRES RESPUESTAS A UNA SOLICITUD</text>
  <g>
    <rect x="48" y="562" width="624" height="72" rx="14" fill="#FFFFFF" stroke="#70BDC2" stroke-width="2"/>
    <text x="76" y="592" font-size="16" font-weight="bold" fill="#161440">Aprobada completa (100%)</text>
    <text x="76" y="616" font-size="14" fill="#5B5975">El cobro queda cubierto y se confirma SIN comprobante.</text>
  </g>
  <g>
    <rect x="48" y="648" width="624" height="72" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <text x="76" y="678" font-size="16" font-weight="bold" fill="#161440">Aprobada parcial</text>
    <text x="76" y="702" font-size="14" fill="#5B5975">Queda saldo: la persona sube el comprobante por la diferencia.</text>
  </g>
  <g>
    <rect x="48" y="734" width="624" height="72" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <text x="76" y="764" font-size="16" font-weight="bold" fill="#161440">Rechazada</text>
    <text x="76" y="788" font-size="14" fill="#5B5975">Se avisa por correo. Se puede volver a plantear si la situación cambió.</text>
  </g>
  <text x="48" y="832" font-size="13" fill="#8B8AA0">Total o parcial se marca EXPLÍCITAMENTE. El sistema no lo adivina.</text>

  <!-- Revocar -->
  <g>
    <rect x="48" y="856" width="624" height="112" rx="14" fill="#FFF8F0"/>
    <rect x="48" y="856" width="6" height="112" rx="3" fill="#EF5554"/>
    <text x="76" y="886" font-size="15" font-weight="bold" fill="#161440">Revocar: se puede o no se puede</text>
    <text x="76" y="914" font-size="14" fill="#5B5975">Una beca ACTIVA se revoca (se otorgó por error, cambió la situación).</text>
    <text x="76" y="936" font-size="14" fill="#5B5975">Una ya USADA no: el canje ocurrió y el cobro se afectó.</text>
    <text x="76" y="958" font-size="13" fill="#8B8AA0">Revertir dinero que ya entró es una devolución, no una beca.</text>
  </g>
</svg>
