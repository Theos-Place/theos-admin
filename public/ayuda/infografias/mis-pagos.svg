<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" role="img" aria-labelledby="t-x d-x" font-family="Arial, Helvetica, sans-serif">
  <title id="t-x">Mis pagos pendientes</title>
  <desc id="d-x">Todo cobro tuyo aparece en Pagos pendientes hasta que quede al día.</desc>

  <rect width="720" height="870" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">Mis pagos pendientes</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#EF5554"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">Todo cobro tuyo aparece en Pagos pendientes hasta que quede al día.</text>

  <g font-size="16">
    <rect x="48" y="148" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="181" r="18" fill="#161440"/>
    <text x="88" y="188" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="122" y="188" fill="#161440">Entrá al sistema y andá a <tspan font-weight="bold">Pagos pendientes</tspan></text>
    <rect x="48" y="226" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="259" r="18" fill="#161440"/>
    <text x="88" y="266" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="122" y="266" fill="#161440">Revisá el cobro: concepto y monto</text>
    <rect x="48" y="304" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="337" r="18" fill="#161440"/>
    <text x="88" y="344" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="122" y="344" fill="#161440">Hacé el pago (SINPE o transferencia) y guardá el screenshot</text>
    <rect x="48" y="382" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="415" r="18" fill="#161440"/>
    <text x="88" y="422" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="122" y="422" fill="#161440">Tocá <tspan font-weight="bold">Pagar</tspan>: subí el comprobante y el número de referencia</text>
    <rect x="48" y="460" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="493" r="18" fill="#161440"/>
    <text x="88" y="500" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="122" y="500" fill="#161440">Enviá — queda <tspan font-weight="bold">en revisión</tspan> con finanzas</text>
  </g>

  <text x="48" y="582" font-size="20" font-weight="bold" fill="#161440">Bueno saber</text>
  <rect x="48" y="594" width="44" height="4" rx="2" fill="#EF5554"/>

  <g font-size="14.5">
    <rect x="48" y="602" width="624" height="88" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="82" cy="636" r="10" fill="#EF5554"/>
    <text x="106" y="632" font-weight="bold" fill="#161440">El comprobante es tu respaldo.</text>
    <text x="106" y="654" fill="#5B5975">Subilo apenas pagás, que es cuando tenés la captura a mano.</text>
    <rect x="48" y="702" width="624" height="88" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="82" cy="736" r="10" fill="#EF5554"/>
    <text x="106" y="732" font-weight="bold" fill="#161440">¿Se rechazó?</text>
    <text x="106" y="754" fill="#5B5975">El sistema te avisa el motivo y podés reintentar con el comprobante correcto.</text>
  </g>

  <text x="48" y="830" font-size="13" fill="#8B89A0">Si el monto no te calza o necesitás una beca, pedila ANTES de pagar — hay una guía aparte.</text>
</svg>
