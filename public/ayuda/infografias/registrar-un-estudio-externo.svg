<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 970" role="img" aria-labelledby="t-ee d-ee" font-family="Arial, Helvetica, sans-serif">
  <title id="t-ee">Registrar un estudio externo</title>
  <desc id="d-ee">Los cinco pasos para registrarle a alguien un estudio que llevó fuera de Theos: abrir el expediente, ir al tab Administrativo, elegir el estudio, marcar que fue externo con su procedencia, y guardar.</desc>

  <rect width="720" height="970" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">Registrar un estudio externo</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#EF5554"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">Alguien llegó a Theos con un estudio que llevó en otra iglesia.</text>

  <g font-size="16">
    <rect x="48" y="148" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="181" r="18" fill="#161440"/>
    <text x="88" y="188" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="122" y="188" fill="#161440">Abrí su expediente y entrá al tab <tspan font-weight="bold">Administrativo</tspan></text>

    <rect x="48" y="226" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="259" r="18" fill="#161440"/>
    <text x="88" y="266" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="122" y="266" fill="#161440">En Acciones de estudios, tocá <tspan font-weight="bold">Agregar estudio</tspan></text>

    <rect x="48" y="304" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="337" r="18" fill="#161440"/>
    <text x="88" y="344" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="122" y="344" fill="#161440">Elegí el <tspan font-weight="bold">estudio</tspan> y la fecha en que lo terminó</text>

    <rect x="48" y="382" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="415" r="18" fill="#161440"/>
    <text x="88" y="422" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="122" y="422" fill="#161440">Marcá <tspan font-weight="bold">«Lo llevó fuera de Theos»</tspan> y escribí dónde</text>

    <rect x="48" y="460" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="493" r="18" fill="#161440"/>
    <text x="88" y="500" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="122" y="500" fill="#161440"><tspan font-weight="bold">Agregar</tspan> — queda con la etiqueta Externo en su historial</text>
  </g>

  <g>
    <rect x="48" y="566" width="624" height="150" rx="14" fill="#161440"/>
    <text x="76" y="600" font-size="12" font-weight="bold" fill="#70BDC2" letter-spacing="2">LA CLAVE</text>
    <text x="76" y="640" font-size="27" font-weight="bold" fill="#FFFFFF">Sin la casilla, queda indistinguible</text>
    <text x="76" y="668" font-size="14.5" fill="#FFFFFF">Un estudio registrado cuenta como prerrequisito, lo marques o no.</text>
    <text x="76" y="690" font-size="14.5" fill="#FFFFFF">La casilla es lo único que responde después: ¿lo llevó acá o lo trajo?</text>
  </g>

  <text x="48" y="762" font-size="20" font-weight="bold" fill="#161440">Bueno saber</text>
  <rect x="48" y="774" width="44" height="4" rx="2" fill="#EF5554"/>

  <g font-size="14.5">
    <rect x="48" y="784" width="624" height="76" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="82" cy="814" r="10" fill="#EF5554"/>
    <text x="106" y="810" font-weight="bold" fill="#161440">Solo admin y coordinación de estudios</text>
    <text x="106" y="832" fill="#5B5975">Si no ves el botón, no es la pantalla: es que tu rol no lo permite.</text>

    <rect x="48" y="872" width="624" height="76" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="82" cy="902" r="10" fill="#EF5554"/>
    <text x="106" y="898" font-weight="bold" fill="#161440">El rastro queda solo</text>
    <text x="106" y="920" fill="#5B5975">Quién lo registró y cuándo se guardan automático. No se pueden cambiar.</text>
  </g>
</svg>
