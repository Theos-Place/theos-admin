<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1240" role="img" aria-labelledby="t-roles d-roles" font-family="Arial, Helvetica, sans-serif">
  <title id="t-roles">Quién ve qué — mapa de roles</title>
  <desc id="d-roles">Los roles agrupados por familia: dirección, coordinaciones, roles acotados y roles que salen de servir; con la regla de que sin rol asignado la persona solo ve lo suyo, y los tres alcances posibles.</desc>

  <rect width="720" height="1240" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">Quién ve qué</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#EF5554"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">El sistema muestra únicamente lo que podés hacer.</text>

  <!-- Regla de oro -->
  <g>
    <rect x="48" y="146" width="624" height="104" rx="14" fill="#161440"/>
    <text x="76" y="178" font-size="12" font-weight="bold" fill="#70BDC2" letter-spacing="2">LA REGLA DE ORO</text>
    <text x="76" y="210" font-size="17" font-weight="bold" fill="#FFFFFF">Sin ningún rol asignado, sos miembro.</text>
    <text x="76" y="236" font-size="14" fill="#9FA8C7">Ves tu perfil, tus estudios, tus pagos y los de tu familia. Nada más.</text>
  </g>

  <!-- Familia 1 -->
  <text x="48" y="298" font-size="12" font-weight="bold" fill="#8B8AA0" letter-spacing="2">DIRECCIÓN Y ADMINISTRACIÓN</text>
  <g>
    <rect x="48" y="314" width="624" height="94" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="48" y="314" width="6" height="94" rx="3" fill="#161440"/>
    <g font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      <rect x="76" y="336" width="86" height="30" rx="15" fill="#161440"/><text x="119" y="356">admin</text>
      <rect x="174" y="336" width="106" height="30" rx="15" fill="#161440"/><text x="227" y="356">direccion</text>
    </g>
    <text x="76" y="392" font-size="14" fill="#5B5975">admin no tiene límite. direccion gestiona los módulos, pero no toca los accesos.</text>
  </g>

  <!-- Familia 2 -->
  <text x="48" y="452" font-size="12" font-weight="bold" fill="#8B8AA0" letter-spacing="2">COORDINACIONES · cada una manda en su módulo</text>
  <g>
    <rect x="48" y="468" width="624" height="140" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="48" y="468" width="6" height="140" rx="3" fill="#EF5554"/>
    <g font-size="13" fill="#161440">
      <rect x="76" y="490" width="188" height="28" rx="14" fill="#F0EFE9"/><text x="90" y="509">coordinador_estudios</text>
      <rect x="276" y="490" width="204" height="28" rx="14" fill="#F0EFE9"/><text x="290" y="509">coordinador_dirigentes</text>
      <rect x="76" y="530" width="212" height="28" rx="14" fill="#F0EFE9"/><text x="90" y="549">coordinador_servidores</text>
      <rect x="300" y="530" width="152" height="28" rx="14" fill="#F0EFE9"/><text x="314" y="549">encargado_staff</text>
      <rect x="76" y="570" width="172" height="28" rx="14" fill="#F0EFE9"/><text x="90" y="589">encargado_eventos</text>
      <rect x="260" y="570" width="150" height="28" rx="14" fill="#F0EFE9"/><text x="274" y="589">comunicaciones</text>
      <rect x="422" y="570" width="96" height="28" rx="14" fill="#F0EFE9"/><text x="436" y="589">finanzas</text>
    </g>
  </g>

  <!-- Familia 3 -->
  <text x="48" y="652" font-size="12" font-weight="bold" fill="#8B8AA0" letter-spacing="2">ROLES ACOTADOS · hacen UNA cosa (los mejores para delegar)</text>
  <g>
    <rect x="48" y="668" width="624" height="180" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="48" y="668" width="6" height="180" rx="3" fill="#70BDC2"/>
    <g font-size="14" fill="#5B5975">
      <text x="76" y="700"><tspan font-weight="bold" fill="#161440">folletos</tspan> — la cola de folletos (y por eso, la de pagos)</text>
      <text x="76" y="726"><tspan font-weight="bold" fill="#161440">revision_pagos</tspan> — revisar comprobantes</text>
      <text x="76" y="752"><tspan font-weight="bold" fill="#161440">becas</tspan> — becas y cupones</text>
      <text x="76" y="778"><tspan font-weight="bold" fill="#161440">editor_perfiles</tspan> — editar fichas de personas</text>
      <text x="76" y="804"><tspan font-weight="bold" fill="#161440">editor_grupos_estudio</tspan> — crear y editar grupos, nada más</text>
      <text x="76" y="830"><tspan font-weight="bold" fill="#161440">reportes</tspan> · <tspan font-weight="bold" fill="#161440">solo_lectura</tspan> — mirar sin tocar</text>
    </g>
  </g>

  <!-- Familia 4 -->
  <text x="48" y="892" font-size="12" font-weight="bold" fill="#8B8AA0" letter-spacing="2">ROLES QUE SALEN DE SERVIR · no se piden, se asignan con el puesto</text>
  <g>
    <rect x="48" y="908" width="624" height="94" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="48" y="908" width="6" height="94" rx="3" fill="#8B8AA0"/>
    <g font-size="14" fill="#5B5975">
      <text x="76" y="940"><tspan font-weight="bold" fill="#161440">dirigente</tspan> — dirige un grupo de estudio</text>
      <text x="76" y="966"><tspan font-weight="bold" fill="#161440">lider_comite</tspan> — lidera un comité</text>
    </g>
    <text x="76" y="990" font-size="13" fill="#8B8AA0">Entrar a un comité los otorga; salir los quita.</text>
  </g>

  <!-- Alcance -->
  <text x="48" y="1046" font-size="12" font-weight="bold" fill="#8B8AA0" letter-spacing="2">EL ALCANCE IMPORTA TANTO COMO EL ROL</text>
  <g font-size="14">
    <rect x="48" y="1062" width="198" height="96" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <text x="72" y="1092" font-weight="bold" fill="#161440">Todo</text>
    <text x="72" y="1118" fill="#5B5975">La organización</text>
    <text x="72" y="1138" fill="#5B5975">completa.</text>

    <rect x="261" y="1062" width="198" height="96" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <text x="285" y="1092" font-weight="bold" fill="#161440">Su comité</text>
    <text x="285" y="1118" fill="#5B5975">El líder ve a su</text>
    <text x="285" y="1138" fill="#5B5975">gente, no el padrón.</text>

    <rect x="474" y="1062" width="198" height="96" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <text x="498" y="1092" font-weight="bold" fill="#161440">Lo propio</text>
    <text x="498" y="1118" fill="#5B5975">El dirigente, sus</text>
    <text x="498" y="1138" fill="#5B5975">grupos.</text>
  </g>

  <text x="48" y="1196" font-size="13" fill="#8B8AA0">Los resúmenes generales (portada de Estudios, de Servidores) piden alcance completo:</text>
  <text x="48" y="1216" font-size="13" fill="#8B8AA0">son la foto de toda la organización, no de tu pedazo. Los accesos los da admin.</text>
</svg>
