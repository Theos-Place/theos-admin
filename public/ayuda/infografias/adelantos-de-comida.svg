<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 940" role="img" aria-labelledby="t-ade d-ade" font-family="Arial, Helvetica, sans-serif">
  <title id="t-ade">Adelantos de comida por sede</title>
  <desc id="d-ade">El mes de una sede: finanzas fija el presupuesto, la sede abre el mes, registra una factura por cada semana de charla, el saldo baja en vivo (lo pendiente también resta, el sobregiro se marca pero no bloquea) y finanzas cierra el mes cuando no quedan facturas pendientes.</desc>

  <rect width="720" height="940" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">Adelantos de comida por sede</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#D63E3D"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">Finanzas → Adelantos de comida. Un mes por sede, una factura por semana, el saldo en vivo.</text>

  <!-- Quién entra -->
  <g font-size="13">
    <rect x="48" y="138" width="304" height="34" rx="17" fill="#161440"/>
    <text x="200" y="160" text-anchor="middle" fill="#FFFFFF" font-weight="bold">ENCARGADO LOGÍSTICA · COORDINADOR COMIDA</text>
    <text x="200" y="192" text-anchor="middle" fill="#8B8AA0">solo su sede, por su puesto</text>
    <rect x="368" y="138" width="304" height="34" rx="17" fill="#70BDC2"/>
    <text x="520" y="160" text-anchor="middle" fill="#161440" font-weight="bold">FINANZAS · DIRECCIÓN · ADMIN</text>
    <text x="520" y="192" text-anchor="middle" fill="#8B8AA0">todas las sedes, fijan presupuesto y cierran</text>
  </g>

  <line x1="84" y1="230" x2="84" y2="830" stroke="#E2E1DA" stroke-width="4"/>

  <!-- 1 -->
  <g>
    <circle cx="84" cy="252" r="22" fill="#70BDC2"/>
    <text x="84" y="259" text-anchor="middle" font-size="18" font-weight="bold" fill="#161440">1</text>
    <rect x="124" y="220" width="548" height="88" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="124" y="220" width="6" height="88" rx="3" fill="#70BDC2"/>
    <text x="150" y="252" font-size="18" font-weight="bold" fill="#161440">Finanzas fija el presupuesto</text>
    <text x="150" y="276" font-size="14" fill="#5B5975">Es un dato de la sede. Se copia al abrir cada mes: subirlo en noviembre</text>
    <text x="150" y="296" font-size="14" fill="#5B5975">no reescribe el saldo de octubre.</text>
  </g>

  <!-- 2 -->
  <g>
    <circle cx="84" cy="360" r="22" fill="#161440"/>
    <text x="84" y="367" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
    <rect x="124" y="328" width="548" height="70" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="124" y="328" width="6" height="70" rx="3" fill="#161440"/>
    <text x="150" y="360" font-size="18" font-weight="bold" fill="#161440">La sede abre el mes</text>
    <text x="150" y="384" font-size="14" fill="#5B5975">Solo el mes en curso. Nace con el presupuesto completo.</text>
  </g>

  <!-- 3 -->
  <g>
    <circle cx="84" cy="450" r="22" fill="#161440"/>
    <text x="84" y="457" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
    <rect x="124" y="418" width="548" height="108" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="124" y="418" width="6" height="108" rx="3" fill="#161440"/>
    <text x="150" y="450" font-size="18" font-weight="bold" fill="#161440">Una factura por cada semana de charla</text>
    <text x="150" y="474" font-size="14" fill="#5B5975">Fecha, proveedor, número de factura electrónica, monto, el encargado</text>
    <text x="150" y="494" font-size="14" fill="#5B5975">de esa semana y la foto. Una factura de otro mes no entra.</text>
    <text x="150" y="514" font-size="13" fill="#8B8AA0">Nace pendiente → finanzas la liquida al conciliar.</text>
  </g>

  <!-- 4 saldo -->
  <g>
    <circle cx="84" cy="578" r="22" fill="#D63E3D"/>
    <text x="84" y="585" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">4</text>
    <rect x="124" y="546" width="548" height="150" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="124" y="546" width="6" height="150" rx="3" fill="#D63E3D"/>
    <text x="150" y="578" font-size="18" font-weight="bold" fill="#161440">El saldo baja en vivo</text>
    <!-- barra -->
    <rect x="150" y="596" width="496" height="14" rx="7" fill="#EFEEE8"/>
    <rect x="150" y="596" width="300" height="14" rx="7" fill="#70BDC2"/>
    <rect x="450" y="596" width="90" height="14" rx="7" fill="#E9B949"/>
    <text x="150" y="632" font-size="13" fill="#5B5975">■ liquidado</text>
    <text x="250" y="632" font-size="13" fill="#A8821F">■ pendiente (también resta: la plata ya se gastó)</text>
    <text x="150" y="660" font-size="14" fill="#5B5975">Si el mes se pasa del presupuesto, aparece <tspan font-weight="bold" fill="#D63E3D">SOBREGIRO</tspan>. No bloquea:</text>
    <text x="150" y="680" font-size="14" fill="#5B5975">el reglamento pide identificar por qué y decidir el reintegro, no impedir registrar.</text>
  </g>

  <!-- 5 -->
  <g>
    <circle cx="84" cy="748" r="22" fill="#70BDC2"/>
    <text x="84" y="755" text-anchor="middle" font-size="18" font-weight="bold" fill="#161440">5</text>
    <rect x="124" y="716" width="548" height="88" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="124" y="716" width="6" height="88" rx="3" fill="#70BDC2"/>
    <text x="150" y="748" font-size="18" font-weight="bold" fill="#161440">Finanzas cierra el mes</text>
    <text x="150" y="772" font-size="14" fill="#5B5975">Solo cuando no quedan facturas pendientes. Se guarda el saldo final,</text>
    <text x="150" y="792" font-size="14" fill="#5B5975">que decide la reposición del mes siguiente.</text>
  </g>

  <rect x="48" y="852" width="624" height="48" rx="12" fill="#161440"/>
  <text x="360" y="881" text-anchor="middle" font-size="14" fill="#FFFFFF">Finanzas baja el mes en Excel: facturas por semana y saldo, para la conciliación.</text>
</svg>
