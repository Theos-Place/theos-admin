<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 970" role="img" aria-labelledby="t-re d-re" font-family="Arial, Helvetica, sans-serif">
  <title id="t-re">Resolver una reubicación</title>
  <desc id="d-re">Los cinco pasos para resolver una solicitud de reubicación: revisar, tomar, elegir el grupo destino (incluido el nivel anterior), anotar y confirmar.</desc>

  <rect width="720" height="970" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">Resolver una reubicación</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#EF5554"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">Gente que se mudó o cambió de horario y quiere seguir estudiando.</text>

  <g font-size="16">
    <rect x="48" y="148" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="181" r="18" fill="#161440"/>
    <text x="88" y="188" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="122" y="188" fill="#161440">Entrá a <tspan font-weight="bold">Estudios → Solicitudes → Reubicaciones</tspan></text>
    <rect x="48" y="226" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="259" r="18" fill="#161440"/>
    <text x="88" y="266" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="122" y="266" fill="#161440"><tspan font-weight="bold">Tomá</tspan> la solicitud (queda a tu nombre) o asignala</text>
    <rect x="48" y="304" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="337" r="18" fill="#161440"/>
    <text x="88" y="344" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="122" y="344" fill="#161440">Tocá <tspan font-weight="bold">Resolver</tspan> y elegí el grupo destino</text>
    <rect x="48" y="382" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="415" r="18" fill="#161440"/>
    <text x="88" y="422" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="122" y="422" fill="#161440">Dejá una nota de resolución si el caso lo amerita</text>
    <rect x="48" y="460" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="493" r="18" fill="#161440"/>
    <text x="88" y="500" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="122" y="500" fill="#161440"><tspan font-weight="bold">Confirmá</tspan> — la matrícula queda hecha al instante</text>
  </g>

  <g>
    <rect x="48" y="566" width="624" height="150" rx="14" fill="#161440"/>
    <text x="76" y="600" font-size="12" font-weight="bold" fill="#70BDC2" letter-spacing="2">LA CLAVE</text>
    <text x="76" y="640" font-size="27" font-weight="bold" fill="#FFFFFF">El nivel anterior también es opción</text>
    <text x="76" y="668" font-size="14.5" fill="#FFFFFF">A veces piden Nivel 3 pero les falta terminar el 2: el selector ofrece</text>
    <text x="76" y="690" font-size="14.5" fill="#FFFFFF">los grupos del estudio pedido Y los del nivel anterior de la cadena.</text>
  </g>

  <text x="48" y="762" font-size="20" font-weight="bold" fill="#161440">Bueno saber</text>
  <rect x="48" y="774" width="44" height="4" rx="2" fill="#EF5554"/>

  <g font-size="14.5">
    <rect x="48" y="784" width="624" height="76" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="82" cy="814" r="10" fill="#EF5554"/>
    <text x="106" y="810" font-weight="bold" fill="#161440">«Ocupo folleto»</text>
    <text x="106" y="832" fill="#5B5975">La matrícula queda pendiente de pago y el tiquete entra solo a la cola de folletos.</text>
    <rect x="48" y="872" width="624" height="76" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="82" cy="902" r="10" fill="#EF5554"/>
    <text x="106" y="898" font-weight="bold" fill="#161440">La persona se entera sola.</text>
    <text x="106" y="920" fill="#5B5975">Al resolver le llega la notificación con su grupo nuevo — no hay que escribirle aparte.</text>
  </g>
</svg>
