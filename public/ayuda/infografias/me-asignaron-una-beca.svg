<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1020" role="img" aria-labelledby="t-beca d-beca" font-family="Arial, Helvetica, sans-serif">
  <title id="t-beca">Me asignaron una beca, ¿ahora qué?</title>
  <desc id="d-beca">El camino de una beca: te llega un correo, la ves en Mis pagos, y al matricularte o inscribirte a un evento aparece la casilla Usar mi beca ya marcada, con el monto ya descontado. Si cubre el total no hay comprobante que subir. Si no tenés beca asignada, en esa misma pantalla hay un campo para un código de descuento.</desc>

  <rect width="720" height="1020" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">Me asignaron una beca</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#D63E3D"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">Aparece sola cuando te matriculás. No hay que buscarla ni escribir nada.</text>

  <!-- Paso 1 -->
  <g>
    <rect x="48" y="150" width="624" height="116" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="208" r="20" fill="#161440"/>
    <text x="88" y="215" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="124" y="186" font-size="18" font-weight="bold" fill="#161440">Te llega un correo</text>
    <text x="124" y="212" font-size="14" fill="#5B5975">Dice cuánto te dieron y para cuál estudio o evento. Puede ser</text>
    <text x="124" y="232" font-size="14" fill="#5B5975">la beca completa, un apoyo parcial, o el aviso de que te la</text>
    <text x="124" y="252" font-size="14" fill="#5B5975">pasaron a otro grupo porque el tuyo se llenó.</text>
  </g>
  <path d="M360 266 v22" stroke="#D63E3D" stroke-width="2" marker-end="url(#bc)"/>

  <!-- Paso 2 -->
  <g>
    <rect x="48" y="296" width="624" height="96" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="344" r="20" fill="#161440"/>
    <text x="88" y="351" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="124" y="332" font-size="18" font-weight="bold" fill="#161440">La ves en Mis pagos</text>
    <text x="124" y="358" font-size="14" fill="#5B5975">Hay una sección "Mis becas" con las que tenés activas,</text>
    <text x="124" y="378" font-size="14" fill="#5B5975">para que sepás con qué contás.</text>
  </g>
  <path d="M360 392 v22" stroke="#D63E3D" stroke-width="2" marker-end="url(#bc)"/>

  <!-- Paso 3 · donde se usa -->
  <g>
    <rect x="48" y="422" width="624" height="152" rx="14" fill="#161440"/>
    <circle cx="88" cy="498" r="20" fill="#70BDC2"/>
    <text x="88" y="505" font-size="16" font-weight="bold" fill="#161440" text-anchor="middle">3</text>
    <text x="124" y="456" font-size="19" font-weight="bold" fill="#FFFFFF">Al matricularte, la casilla ya viene marcada</text>
    <text x="124" y="484" font-size="14" fill="#D7DAEA">En la pantalla de confirmación aparece «Usar mi beca (30% de</text>
    <text x="124" y="504" font-size="14" fill="#D7DAEA">descuento)» con lo tuyo, y ya viene activada. El monto que ves</text>
    <text x="124" y="524" font-size="14" fill="#D7DAEA">abajo es el que vas a pagar, con el descuento aplicado.</text>
    <text x="124" y="552" font-size="14" font-weight="bold" fill="#9FE5E9">Confirmás y listo. No hay nada más que hacer.</text>
  </g>
  <path d="M360 574 v22" stroke="#D63E3D" stroke-width="2" marker-end="url(#bc)"/>

  <!-- Paso 4 -->
  <g>
    <rect x="48" y="604" width="624" height="92" rx="14" fill="#FFFFFF" stroke="#70BDC2" stroke-width="2"/>
    <circle cx="88" cy="650" r="20" fill="#2C7A7F"/>
    <text x="88" y="657" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="124" y="638" font-size="18" font-weight="bold" fill="#161440">Si cubre el total, no subís nada</text>
    <text x="124" y="664" font-size="14" fill="#5B5975">El monto baja a cero y la matrícula queda confirmada sin</text>
    <text x="124" y="684" font-size="14" fill="#5B5975">comprobante. La pantalla te lo dice.</text>
  </g>

  <!-- Beca vs código -->
  <text x="48" y="746" font-size="12" font-weight="bold" fill="#8B8AA0" letter-spacing="2">BECA Y CÓDIGO NO SON LO MISMO</text>
  <g>
    <rect x="48" y="762" width="304" height="112" rx="14" fill="#EEF4F5" stroke="#70BDC2"/>
    <text x="76" y="792" font-size="15" font-weight="bold" fill="#2C7A7F">Beca asignada</text>
    <text x="76" y="818" font-size="14" fill="#5B5975">Te la dieron a vos, para algo</text>
    <text x="76" y="838" font-size="14" fill="#5B5975">concreto. Aparece sola en la</text>
    <text x="76" y="858" font-size="14" fill="#5B5975">pantalla, ya marcada.</text>
  </g>
  <g>
    <rect x="368" y="762" width="304" height="112" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <text x="396" y="792" font-size="15" font-weight="bold" fill="#161440">Código de descuento</text>
    <text x="396" y="818" font-size="14" fill="#5B5975">Es genérico. Si no tenés beca,</text>
    <text x="396" y="838" font-size="14" fill="#5B5975">en esa misma pantalla hay un</text>
    <text x="396" y="858" font-size="14" fill="#5B5975">campo para escribirlo.</text>
  </g>

  <!-- Las reglas -->
  <g>
    <rect x="48" y="906" width="624" height="76" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <text x="76" y="936" font-size="15" font-weight="bold" fill="#161440">Una sola vez, una por cobro, y las de monto fijo en su moneda</text>
    <text x="76" y="962" font-size="14" fill="#5B5975">Si ya te habías matriculado antes de que te la dieran, escribí a soporte: finanzas la aplica.</text>
  </g>

  <defs>
    <marker id="bc" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 0 L5 10 z" fill="#D63E3D"/>
    </marker>
  </defs>
</svg>
