<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1240" role="img" aria-labelledby="t-revisar d-revisar">
  <title id="t-revisar">Revisar y aceptar aplicaciones a puestos</title>
  <!--
    COLORES: medidos con src/lib/contrast.ts sobre el papel #f4f4f0
    (AGENTS.md / accessibility.md), no elegidos a ojo.
      · navy      #161440 → 15.76:1
      · gris      #555    →  6.76:1
      · tealDeep  #3B7579 →  4.75:1
      · verde     #216B45 →  5.85:1
      · coralDeep #C43635 →  4.85:1  (el coral normal da 4.13: no alcanza
        para 13px en negrita, que no cuenta como «texto grande»)
    Sobre el navy: blanco 17.38:1 y el teal claro #70BDC2 8.07:1.
  -->
  <desc id="d-revisar">Los cinco estados de una aplicación y quién se entera de cada uno. Recibida no avisa a nadie. Enviada al encargado le avisa al encargado del puesto. En revisión le avisa a RH y staff y es el único estado que pide un motivo. Aceptada le avisa a RH y staff, da de alta a la persona en el puesto y le sincroniza los roles, y no se deshace desde esta pantalla. Rechazada no avisa a nadie, a propósito. No hay un orden obligatorio: desde Recibida se puede ir a cualquier estado, y el camino normal es Recibida, Enviada al encargado, Aceptada. Las aplicaciones se pueden mover varias a la vez con las casillas de selección.</desc>

  <rect width="720" height="1240" fill="#f4f4f0"/>

  <text x="40" y="54" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#161440">Los cinco estados de una aplicación</text>
  <rect x="40" y="68" width="56" height="4" rx="2" fill="#D63E3D"/>
  <text x="40" y="96" font-family="Arial, sans-serif" font-size="14" fill="#555">Qué significa cada uno, y a quién le avisa.</text>

  <g font-family="Arial, sans-serif">

    <!-- El camino normal -->
    <text x="40" y="136" font-size="13" letter-spacing="1.5" fill="#3B7579">EL CAMINO NORMAL</text>

    <rect x="40" y="152" width="178" height="56" rx="12" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="129" y="178" font-size="14" font-weight="bold" fill="#161440" text-anchor="middle">Recibida</text>
    <text x="129" y="196" font-size="11.5" fill="#555" text-anchor="middle">nadie la ha tocado</text>

    <path d="M224 180 H254" stroke="#70BDC2" stroke-width="3"/>
    <path d="M248 173 L260 180 L248 187 Z" fill="#70BDC2"/>

    <rect x="266" y="152" width="188" height="56" rx="12" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="360" y="174" font-size="14" font-weight="bold" fill="#161440" text-anchor="middle">Enviada al encargado</text>
    <text x="360" y="194" font-size="11.5" fill="#555" text-anchor="middle">ya tiene sus datos</text>

    <path d="M460 180 H490" stroke="#70BDC2" stroke-width="3"/>
    <path d="M484 173 L496 180 L484 187 Z" fill="#70BDC2"/>

    <rect x="502" y="152" width="178" height="56" rx="12" fill="#ffffff" stroke="#216B45"/>
    <text x="591" y="178" font-size="14" font-weight="bold" fill="#216B45" text-anchor="middle">Aceptada</text>
    <text x="591" y="196" font-size="11.5" fill="#555" text-anchor="middle">ya está sirviendo</text>

    <rect x="40" y="226" width="640" height="34" rx="10" fill="#161440"/>
    <text x="360" y="248" font-size="12.5" fill="#ffffff" text-anchor="middle">Pero no hay orden obligatorio: desde Recibida se puede ir a cualquiera.</text>

    <!-- Quién se entera -->
    <text x="40" y="300" font-size="13" letter-spacing="1.5" fill="#3B7579">QUIÉN SE ENTERA DE CADA CAMBIO</text>

    <rect x="40" y="318" width="640" height="46" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="64" y="347" font-size="13.5" font-weight="bold" fill="#161440">Recibida</text>
    <text x="300" y="347" font-size="13" fill="#555">No avisa a nadie.</text>

    <rect x="40" y="372" width="640" height="46" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="64" y="401" font-size="13.5" font-weight="bold" fill="#161440">Enviada al encargado</text>
    <text x="300" y="401" font-size="13" fill="#3B7579">Al encargado del puesto.</text>

    <rect x="40" y="426" width="640" height="46" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="64" y="455" font-size="13.5" font-weight="bold" fill="#161440">En revisión</text>
    <text x="300" y="455" font-size="13" fill="#3B7579">A RH y staff.</text>

    <rect x="40" y="480" width="640" height="46" rx="10" fill="#ffffff" stroke="#216B45"/>
    <text x="64" y="509" font-size="13.5" font-weight="bold" fill="#161440">Aceptada</text>
    <text x="300" y="509" font-size="13" fill="#3B7579">A RH y staff.</text>

    <rect x="40" y="534" width="640" height="46" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="64" y="563" font-size="13.5" font-weight="bold" fill="#161440">Rechazada</text>
    <text x="300" y="563" font-size="13" fill="#555">No avisa a nadie.</text>

    <rect x="40" y="596" width="640" height="76" rx="12" fill="#ffffff" stroke="#C43635"/>
    <text x="64" y="624" font-size="13.5" font-weight="bold" fill="#161440">El silencio del rechazo es a propósito</text>
    <text x="64" y="648" font-size="12.5" fill="#555">Un correo automático de rechazo es peor que no decir nada.</text>
    <text x="64" y="664" font-size="12.5" fill="#555">Esa conversación la tiene una persona.</text>

    <!-- La regla dura -->
    <rect x="40" y="700" width="640" height="150" rx="14" fill="#161440"/>
    <text x="64" y="732" font-size="12" letter-spacing="1.5" fill="#70BDC2">LA ÚNICA REGLA DURA</text>
    <text x="64" y="762" font-size="17" font-weight="bold" fill="#ffffff">«Aceptada» no se deshace desde acá</text>
    <text x="64" y="790" font-size="12.5" fill="#ffffff">Aceptar da de alta a la persona en el puesto y le sincroniza los roles</text>
    <text x="64" y="808" font-size="12.5" fill="#ffffff">que ese puesto otorga: ya está sirviendo y ya tiene los permisos.</text>
    <text x="64" y="834" font-size="12.5" fill="#aeb9d4">Para revertirlo se la quita del puesto desde la página del comité.</text>

    <text x="40" y="884" font-size="12.5" fill="#555">Los otros cuatro estados sí se cambian las veces que haga falta.</text>

    <!-- El motivo -->
    <rect x="40" y="908" width="312" height="134" rx="14" fill="#ffffff" stroke="#3B7579"/>
    <text x="64" y="938" font-size="15" font-weight="bold" fill="#161440">El motivo</text>
    <text x="64" y="964" font-size="12.5" fill="#555">«En revisión» es el ÚNICO</text>
    <text x="64" y="982" font-size="12.5" fill="#555">estado que pide uno.</text>
    <text x="64" y="1008" font-size="12.5" fill="#555">Es el único donde tiene dónde</text>
    <text x="64" y="1026" font-size="12.5" fill="#555">leerse: quien resuelve lo lee.</text>

    <!-- Varias a la vez -->
    <rect x="368" y="908" width="312" height="134" rx="14" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="392" y="938" font-size="15" font-weight="bold" fill="#161440">Varias a la vez</text>
    <text x="392" y="964" font-size="12.5" fill="#555">Si llegaron diez del mismo</text>
    <text x="392" y="982" font-size="12.5" fill="#555">puesto, se marcan y se mueven</text>
    <text x="392" y="1000" font-size="12.5" fill="#555">juntas con las casillas.</text>
    <text x="392" y="1026" font-size="12" fill="#3B7579">Los filtros arman el grupo.</text>

    <!-- Los filtros -->
    <text x="40" y="1086" font-size="13" letter-spacing="1.5" fill="#3B7579">LOS FILTROS DE ARRIBA</text>

    <rect x="40" y="1104" width="118" height="40" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="99" y="1129" font-size="12.5" fill="#161440" text-anchor="middle">Comité</text>

    <rect x="170" y="1104" width="118" height="40" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="229" y="1129" font-size="12.5" fill="#161440" text-anchor="middle">Ubicación</text>

    <rect x="300" y="1104" width="118" height="40" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="359" y="1129" font-size="12.5" fill="#161440" text-anchor="middle">Sede</text>

    <rect x="430" y="1104" width="118" height="40" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="489" y="1129" font-size="12.5" fill="#161440" text-anchor="middle">Estado</text>

    <rect x="560" y="1104" width="120" height="40" rx="10" fill="#ffffff" stroke="#dcdcd4"/>
    <text x="620" y="1129" font-size="12.5" fill="#161440" text-anchor="middle">Búsqueda</text>

    <text x="40" y="1174" font-size="12.5" fill="#555">«Ubicación» es dónde se sirve el PUESTO. «Sede» es la de la PERSONA:</text>
    <text x="40" y="1192" font-size="12.5" fill="#555">alguien de Lindora puede aplicar a un puesto de Escazú.</text>
  </g>
</svg>
