<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 792" role="img" aria-labelledby="t-x d-x" font-family="Arial, Helvetica, sans-serif">
  <title id="t-x">Mi perfil y mis datos</title>
  <desc id="d-x">Tus datos, tus estudios y tus pagos viven en un solo lugar.</desc>

  <rect width="720" height="792" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">Mi perfil y mis datos</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#EF5554"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">Tus datos, tus estudios y tus pagos viven en un solo lugar.</text>

  <g font-size="16">
    <rect x="48" y="148" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="181" r="18" fill="#161440"/>
    <text x="88" y="188" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="122" y="188" fill="#161440">Entrá al sistema y tocá <tspan font-weight="bold">Mi perfil</tspan></text>
    <rect x="48" y="226" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="259" r="18" fill="#161440"/>
    <text x="88" y="266" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="122" y="266" fill="#161440">Revisá tus datos, tus estudios y tus pagos en las pestañas</text>
    <rect x="48" y="304" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="337" r="18" fill="#161440"/>
    <text x="88" y="344" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="122" y="344" fill="#161440">Tocá <tspan font-weight="bold">Editar</tspan> para corregir lo que esté mal</text>
    <rect x="48" y="382" width="624" height="66" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="88" cy="415" r="18" fill="#161440"/>
    <text x="88" y="422" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="122" y="422" fill="#161440">Guardá los cambios — quedan al instante</text>
  </g>

  <text x="48" y="504" font-size="20" font-weight="bold" fill="#161440">Bueno saber</text>
  <rect x="48" y="516" width="44" height="4" rx="2" fill="#EF5554"/>

  <g font-size="14.5">
    <rect x="48" y="524" width="624" height="88" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="82" cy="558" r="10" fill="#EF5554"/>
    <text x="106" y="554" font-weight="bold" fill="#161440">Tu cédula importa.</text>
    <text x="106" y="576" fill="#5B5975">Algunos trámites (como el prematrimonial) la necesitan — el sistema te avisa si falta.</text>
    <rect x="48" y="624" width="624" height="88" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <circle cx="82" cy="658" r="10" fill="#EF5554"/>
    <text x="106" y="654" font-weight="bold" fill="#161440">Solo vos editás tu ficha.</text>
    <text x="106" y="676" fill="#5B5975">Nadie más puede tocar tus datos personales, salvo el equipo autorizado.</text>
  </g>

  <text x="48" y="752" font-size="13" fill="#8B89A0">Si un dato no te deja corregirlo, escribinos a soporte@theosplace.org.</text>
</svg>
