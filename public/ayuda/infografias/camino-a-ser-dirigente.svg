<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1220" role="img" aria-labelledby="t-cdeb d-cdeb" font-family="Arial, Helvetica, sans-serif">
  <title id="t-cdeb">El camino a ser dirigente (CDEB)</title>
  <desc id="d-cdeb">Seis pasos: recomendación al cerrar Discípulos 3 o Panorama, convocatoria del comité, preinscripción de la persona, selección, invitación automática y capacitación.</desc>

  <rect width="720" height="1220" fill="#F6F5F2"/>

  <text x="48" y="66" font-size="30" font-weight="bold" fill="#161440">El camino a ser dirigente</text>
  <rect x="48" y="80" width="60" height="4" rx="2" fill="#EF5554"/>
  <text x="48" y="114" font-size="15" fill="#5B5975">CDEB no se matricula: se entra por invitación. Quién hace qué.</text>

  <!-- Carriles -->
  <g font-size="11" font-weight="bold" letter-spacing="1.5">
    <text x="96" y="152" fill="#8B8AA0" text-anchor="middle">DIRIGENTE</text>
    <text x="360" y="152" fill="#8B8AA0" text-anchor="middle">COMITÉ</text>
    <text x="624" y="152" fill="#8B8AA0" text-anchor="middle">LA PERSONA</text>
  </g>
  <line x1="48" y1="164" x2="672" y2="164" stroke="#E2E1DA"/>

  <!-- 1 dirigente -->
  <g>
    <rect x="48" y="184" width="440" height="126" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="48" y="184" width="6" height="126" rx="3" fill="#161440"/>
    <circle cx="88" cy="216" r="17" fill="#161440"/>
    <text x="88" y="222" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="118" y="222" font-size="18" font-weight="bold" fill="#161440">La recomendación</text>
    <text x="76" y="252" font-size="14" fill="#5B5975">Al cerrar Discípulos 3 o Panorama, el dirigente</text>
    <text x="76" y="272" font-size="14" fill="#5B5975">recomienda a cada estudiante aprobado.</text>
    <text x="76" y="296" font-size="13" fill="#8B8AA0">No bloquea el cierre: se puede guardar como borrador.</text>
  </g>

  <!-- 2 comité -->
  <g>
    <rect x="140" y="330" width="440" height="106" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="140" y="330" width="6" height="106" rx="3" fill="#EF5554"/>
    <circle cx="180" cy="362" r="17" fill="#EF5554"/>
    <text x="180" y="368" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="210" y="368" font-size="18" font-weight="bold" fill="#161440">La convocatoria</text>
    <text x="168" y="398" font-size="14" fill="#5B5975">El comité manda el link de preinscripción solo a</text>
    <text x="168" y="418" font-size="14" fill="#5B5975">quien tiene recomendación positiva.</text>
  </g>

  <!-- 3 persona -->
  <g>
    <rect x="232" y="456" width="440" height="146" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="232" y="456" width="6" height="146" rx="3" fill="#70BDC2"/>
    <circle cx="272" cy="488" r="17" fill="#70BDC2"/>
    <text x="272" y="494" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="302" y="494" font-size="18" font-weight="bold" fill="#161440">La preinscripción</text>
    <text x="260" y="524" font-size="14" fill="#5B5975">Los 9 compromisos del dirigente, la declaración</text>
    <text x="260" y="544" font-size="14" fill="#5B5975">doctrinal, 7 preguntas abiertas, disponibilidad</text>
    <text x="260" y="564" font-size="14" fill="#5B5975">y cuál grupo le sirve.</text>
    <text x="260" y="588" font-size="13" fill="#C4383A">Información sensible: la ve solo el comité.</text>
  </g>

  <!-- 4 comité -->
  <g>
    <rect x="140" y="622" width="440" height="126" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="140" y="622" width="6" height="126" rx="3" fill="#EF5554"/>
    <circle cx="180" cy="654" r="17" fill="#EF5554"/>
    <text x="180" y="660" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="210" y="660" font-size="18" font-weight="bold" fill="#161440">La selección</text>
    <text x="168" y="690" font-size="14" fill="#5B5975">Aprobado · lista de espera · no seleccionado,</text>
    <text x="168" y="710" font-size="14" fill="#5B5975">con notas internas que la persona no ve.</text>
    <text x="168" y="734" font-size="13" fill="#8B8AA0">La recomendación del paso 1 aparece al lado de cada respuesta.</text>
  </g>

  <!-- 5 sistema -->
  <g>
    <rect x="48" y="768" width="624" height="130" rx="14" fill="#161440"/>
    <circle cx="88" cy="800" r="17" fill="#FFFFFF"/>
    <text x="88" y="806" font-size="14" font-weight="bold" fill="#161440" text-anchor="middle">5</text>
    <text x="118" y="806" font-size="18" font-weight="bold" fill="#FFFFFF">La invitación — la manda el sistema</text>
    <text x="76" y="838" font-size="14" fill="#FFFFFF">Dos cosas de una vez: crea la invitación al plan (lo que destraba la</text>
    <text x="76" y="858" font-size="14" fill="#FFFFFF">matrícula) y manda el correo de seleccionado.</text>
    <text x="76" y="884" font-size="13" fill="#9FA8C7">Lista de espera y no seleccionados NO reciben nada automático: eso se habla.</text>
  </g>

  <!-- 6 -->
  <g>
    <rect x="48" y="928" width="624" height="112" rx="14" fill="#FFFFFF" stroke="#E2E1DA"/>
    <rect x="48" y="928" width="6" height="112" rx="3" fill="#70BDC2"/>
    <circle cx="88" cy="960" r="17" fill="#70BDC2"/>
    <text x="88" y="966" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="118" y="966" font-size="18" font-weight="bold" fill="#161440">La capacitación</text>
    <text x="76" y="996" font-size="14" fill="#5B5975">Presencial, con posible pasantía de al menos 8 semanas.</text>
    <text x="76" y="1018" font-size="14" fill="#5B5975">Después: preparar cada semana y compromiso de un año.</text>
  </g>

  <!-- Quién lee la recomendación -->
  <g>
    <rect x="48" y="1070" width="624" height="112" rx="14" fill="#FFF8F0"/>
    <rect x="48" y="1070" width="6" height="112" rx="3" fill="#EF5554"/>
    <text x="76" y="1102" font-size="15" font-weight="bold" fill="#161440">Quién lee la recomendación</text>
    <text x="76" y="1128" font-size="14" fill="#5B5975">Solo coordinación de dirigentes, de estudios y administración.</text>
    <text x="76" y="1150" font-size="14" fill="#5B5975">Ni el estudiante, ni el propio dirigente una vez enviada.</text>
    <text x="76" y="1172" font-size="13" fill="#8B8AA0">Quien está marcado "no recomendado para dar estudios" queda fuera automáticamente.</text>
  </g>
</svg>
