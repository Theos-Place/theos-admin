<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;color:var(--fg);font-family:var(--font-body)}
  .wrap{padding:22px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:72px;height:72px;background:#52C0C4}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-soft)}
  .name{font-family:var(--font-display);font-weight:700;font-size:12px}
</style></head>
<body><div class="wrap">
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">xs</div><div class="lbl">4px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">sm</div><div class="lbl">8px</div></div>
  <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">md</div><div class="lbl">14px</div></div>
  <div class="item"><div class="box" style="border-radius:20px"></div><div class="name">lg</div><div class="lbl">20px</div></div>
  <div class="item"><div class="box" style="border-radius:28px"></div><div class="name">xl</div><div class="lbl">28px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="lbl">999px</div></div>
</div></body></html>
