<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;color:var(--fg)}
  .wrap{padding:22px}
  .row{display:flex;align-items:baseline;gap:18px;padding:10px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .label{font-family:var(--font-mono);font-size:11px;color:var(--fg-soft);min-width:100px;text-transform:uppercase;letter-spacing:.12em}
  .spec{font-family:var(--font-mono);font-size:11px;color:var(--fg-soft);margin-left:auto}
  .t{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;color:var(--fg)}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="label">Display 1</span><span class="t" style="font-size:54px;line-height:1">Apúntate</span><span class="spec">Axis Extrabold · 88/0.95</span></div>
  <div class="row"><span class="label">H1</span><span class="t" style="font-size:34px">Ven como estés</span><span class="spec">Axis · 44/1.08</span></div>
  <div class="row"><span class="label">H2</span><span class="t" style="font-size:26px">Próximo estudio</span><span class="spec">Axis · 32/1.15</span></div>
  <div class="row"><span class="label">H3</span><span class="t" style="font-size:20px">Estudios Madrid</span><span class="spec">Axis · 24/1.22</span></div>
</div></body></html>
