<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-body);color:var(--fg)}
  .wrap{padding:20px}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .sw{border-radius:10px;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid rgba(21,20,64,.05)}
  .name{font-family:var(--font-display);font-weight:700;font-size:11px}
  .hex{font-family:var(--font-mono);font-size:9.5px;opacity:.8}
</style></head>
<body><div class="wrap"><div class="row">
  <div class="sw" style="background:#FFFFFF"><div class="name">0</div><div class="hex">#FFFFFF</div></div>
  <div class="sw" style="background:#FAFAFC"><div class="name">50</div><div class="hex">#FAFAFC</div></div>
  <div class="sw" style="background:#F1F2F6"><div class="name">100</div><div class="hex">#F1F2F6</div></div>
  <div class="sw" style="background:#E4E6EE"><div class="name">200</div><div class="hex">#E4E6EE</div></div>
  <div class="sw" style="background:#C9CCD9"><div class="name">300</div><div class="hex">#C9CCD9</div></div>
  <div class="sw" style="background:#9CA0B4;color:#fff"><div class="name">400</div><div class="hex">#9CA0B4</div></div>
  <div class="sw" style="background:#6E7290;color:#fff"><div class="name">500</div><div class="hex">#6E7290</div></div>
  <div class="sw" style="background:#4E5274;color:#fff"><div class="name">600</div><div class="hex">#4E5274</div></div>
  <div class="sw" style="background:#232748;color:#fff"><div class="name">800</div><div class="hex">#232748</div></div>
  <div class="sw" style="background:#151440;color:#fff"><div class="name">900</div><div class="hex">#151440</div></div>
</div></div></body></html>
