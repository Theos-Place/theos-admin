<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Brand Patterns</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff}
  .wrap{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/7}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .lbl{position:absolute;left:10px;bottom:8px;font-family:var(--font-mono);font-size:10px;color:#fff;background:rgba(21,20,64,.7);padding:4px 8px;border-radius:6px;letter-spacing:.08em;text-transform:uppercase}
</style></head>
<body><div class="wrap">
  <div class="tile"><img src="../assets/pattern-navy-hero.jpg"><span class="lbl">Navy — hero</span></div>
  <div class="tile"><img src="../assets/pattern-teal-banner.png"><span class="lbl">Teal — banner</span></div>
  <div class="tile"><img src="../assets/pattern-coral.png"><span class="lbl">Coral — loud</span></div>
  <div class="tile"><img src="../assets/pattern-white-icons.png"><span class="lbl">White — divider</span></div>
</div></body></html>
