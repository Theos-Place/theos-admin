<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;color:var(--fg);font-family:var(--font-body)}
  .wrap{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:center;min-height:140px}
  .on-white{background:#fff;border:1px solid #E4E6EE}
  .on-navy{background:#151440}
  .on-coral{background:#FF444C}
  .on-teal{background:#52C0C4}
  .tile img{max-width:70%;max-height:96px;object-fit:contain}
</style></head>
<body><div class="wrap">
  <div class="tile on-white"><img src="../assets/logo-theos-original.png" alt="Theos Place logo"></div>
  <div class="tile on-navy"><img src="../assets/logo-theos-white.png" alt="Theos Place logo white"></div>
  <div class="tile on-coral"><img src="../assets/logo-theos-white.png" alt="Theos Place logo white"></div>
  <div class="tile on-teal"><img src="../assets/logo-theos-original.png" alt="Theos Place logo"></div>
</div></body></html>
