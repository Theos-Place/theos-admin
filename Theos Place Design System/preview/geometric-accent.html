<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Geometric Ɵ Accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-body);color:var(--fg)}
  .box{margin:18px;height:150px;background:var(--surface);border-radius:var(--radius-lg);position:relative;overflow:hidden;padding:24px 28px;display:flex;flex-direction:column;justify-content:center}
  .theta{position:absolute;right:-60px;bottom:-60px;width:240px;height:240px;color:#70BDC2;opacity:.12;pointer-events:none}
  .eyebrow{font-family:var(--font-display);font-weight:800;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#EF5554}
  h2{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-0.02em;margin:6px 0 0;color:#161440}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-soft);margin-left:18px;margin-top:-6px}
</style></head>
<body>
<div class="box">
  <svg class="theta" viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="8"/><rect x="14" y="46" width="72" height="8" fill="currentColor"/></svg>
  <div class="eyebrow">COMUNIDAD</div>
  <h2>Un sitio para<br>hacerse preguntas.</h2>
</div>
<div class="meta">Large, low-opacity Ɵ clipped by screen edge · one per screen · not a confetti field</div>
</body></html>
