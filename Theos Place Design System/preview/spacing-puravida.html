<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pura Vida Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-body);color:var(--fg)}
  .wrap{padding:18px}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .bar{background:#161440;height:14px;border-radius:4px}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--fg-soft);width:110px}
  .lbl{font-family:var(--font-body);font-weight:300;font-size:12.5px;color:var(--fg)}
  h4{font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;color:var(--fg-soft)}
  .asym{margin-top:14px;border-radius:var(--radius-lg);background:var(--surface-container-low);padding:4rem 1.4rem 5.5rem;position:relative}
  .asym .eyebrow{font-family:var(--font-display);font-weight:800;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#EF5554}
  .asym h3{font-family:var(--font-display);font-weight:800;font-size:22px;color:#161440;margin:4px 0 0;line-height:1}
  .arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:10px;color:var(--fg-soft);text-align:right;line-height:1.4}
</style></head>
<body><div class="wrap">
  <h4>Scale · base 0.35rem / 5.6px</h4>
  <div class="row"><div class="tok">--space-1</div><div class="bar" style="width:5.6px"></div><div class="lbl">0.35rem · micro</div></div>
  <div class="row"><div class="tok">--space-2</div><div class="bar" style="width:11.2px"></div><div class="lbl">0.7rem · micro</div></div>
  <div class="row"><div class="tok">--space-4</div><div class="bar" style="width:22.4px"></div><div class="lbl">1.4rem · standard</div></div>
  <div class="row"><div class="tok">--space-6</div><div class="bar" style="width:32px"></div><div class="lbl">2rem · standard</div></div>
  <div class="row"><div class="tok">--space-12</div><div class="bar" style="width:64px"></div><div class="lbl">4rem · macro · top</div></div>
  <div class="row"><div class="tok">--space-16</div><div class="bar" style="width:88px"></div><div class="lbl">5.5rem · macro · bottom</div></div>
  <div class="row"><div class="tok">--space-20</div><div class="bar" style="width:112px"></div><div class="lbl">7rem · macro</div></div>
</div></body></html>
