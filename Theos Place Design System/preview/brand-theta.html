<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Theta Mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;color:var(--fg);font-family:var(--font-body)}
  .wrap{padding:22px;display:flex;gap:24px;align-items:center;justify-content:center}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px}
  .mark{display:flex;align-items:center;justify-content:center;border-radius:22px}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-soft)}
  .name{font-family:var(--font-display);font-weight:700;font-size:12px}
</style></head>
<body><div class="wrap">
  <div class="tile"><div class="mark" style="width:80px;height:80px;background:#fff;border:1px solid #E4E6EE;color:#29365C"><svg width="48" height="48" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="10"/><rect x="14" y="45" width="72" height="10" fill="currentColor"/></svg></div><div class="name">Ɵ on white</div><div class="lbl">navy</div></div>
  <div class="tile"><div class="mark" style="width:80px;height:80px;background:#151440;color:#52C0C4"><svg width="48" height="48" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="10"/><rect x="14" y="45" width="72" height="10" fill="currentColor"/></svg></div><div class="name">Ɵ on navy</div><div class="lbl">teal</div></div>
  <div class="tile"><div class="mark" style="width:80px;height:80px;background:#52C0C4;color:#151440"><svg width="48" height="48" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="10"/><rect x="14" y="45" width="72" height="10" fill="currentColor"/></svg></div><div class="name">Ɵ on teal</div><div class="lbl">navy</div></div>
  <div class="tile"><div class="mark" style="width:80px;height:80px;background:#FF444C;color:#fff"><svg width="48" height="48" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="10"/><rect x="14" y="45" width="72" height="10" fill="currentColor"/></svg></div><div class="name">Ɵ on coral</div><div class="lbl">white</div></div>
</div></body></html>
