<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Coral Pulse · Glassmorphism</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-body);color:var(--fg)}
  .wrap{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  h4{font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;color:var(--fg-soft)}
  .box{position:relative;height:150px;border-radius:var(--radius-lg);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .pulse-bg{background:#F8FAFB}
  .pulse{padding:14px 30px;border-radius:999px;background:#EF5554;color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.01em;box-shadow:0 12px 32px rgba(239,85,84,0.28);border:0;cursor:pointer}
  .glass-bg{background:#161440;position:relative}
  .theta-bg{position:absolute;right:-30px;top:-10px;width:140px;height:140px;color:#70BDC2;opacity:.28}
  .glass{position:relative;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(248,250,251,0.72);border-radius:999px;padding:12px 22px;font-family:var(--font-display);font-weight:800;color:#161440;font-size:14px;letter-spacing:.06em}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-soft);margin-top:6px}
</style></head>
<body><div class="wrap">
  <div>
    <h4>Coral Pulse — primary CTA</h4>
    <div class="box pulse-bg"><button class="pulse">Apúntate al estudio</button></div>
    <div class="meta">Flat #EF5554 · pill · ambient coral glow 0 12px 32px @28%</div>
  </div>
  <div>
    <h4>Glassmorphism — floating chrome</h4>
    <div class="box glass-bg">
      <svg class="theta-bg" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="8"/><rect x="14" y="46" width="72" height="8" fill="currentColor"/></svg>
      <div class="glass">INICIO · ESTUDIOS · NOSOTROS</div>
    </div>
    <div class="meta">backdrop-filter: blur(16px) · nav / FAB only</div>
  </div>
</div></body></html>
