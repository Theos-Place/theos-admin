<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Event Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#FAFAFC;color:var(--fg);font-family:var(--font-body)}
  .wrap{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 2px 8px rgba(21,20,64,.08);display:flex;flex-direction:column;gap:10px}
  .card.feat{border:2px solid #F05655}
  .eyebrow{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#F05655}
  .t{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.2;color:#29365C;margin:0}
  .meta{font-family:var(--font-body);font-size:13px;color:#6E7290}
  .cta{margin-top:6px;font-family:var(--font-display);font-weight:700;font-size:14px;color:#F05655}
</style></head>
<body><div class="wrap">
  <div class="card feat">
    <span class="eyebrow">ESTUDIOS · MADRID</span>
    <h3 class="t">Ven como estés — estudio de los jueves</h3>
    <div class="meta">Jue 7 May · 19:30 · Gran Vía 22</div>
    <div class="cta">Apúntate →</div>
  </div>
  <div class="card">
    <span class="eyebrow">DOMINGO</span>
    <h3 class="t">Nos vemos este domingo</h3>
    <div class="meta">Dom 10 May · 11:00 · Sala Atlas</div>
    <div class="cta">Más info →</div>
  </div>
</div></body></html>
