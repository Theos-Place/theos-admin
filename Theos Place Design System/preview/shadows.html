<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#FAFAFC;color:var(--fg);font-family:var(--font-body)}
  .wrap{padding:32px 22px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:90px;height:68px;border-radius:14px;background:#fff}
  .name{font-family:var(--font-display);font-weight:700;font-size:12px}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-soft)}
</style></head>
<body><div class="wrap">
  <div class="item"><div class="box" style="box-shadow:0 1px 2px rgba(21,20,64,.06)"></div><div class="name">xs</div><div class="lbl">resting</div></div>
  <div class="item"><div class="box" style="box-shadow:0 2px 8px rgba(21,20,64,.08)"></div><div class="name">sm</div><div class="lbl">card</div></div>
  <div class="item"><div class="box" style="box-shadow:0 8px 24px rgba(21,20,64,.10)"></div><div class="name">md</div><div class="lbl">hover</div></div>
  <div class="item"><div class="box" style="box-shadow:0 18px 48px rgba(21,20,64,.14)"></div><div class="name">lg</div><div class="lbl">modal</div></div>
  <div class="item"><div class="box" style="background:#F05655;box-shadow:0 10px 28px rgba(240,86,85,.32)"></div><div class="name">coral</div><div class="lbl">CTA glow</div></div>
</div></body></html>
