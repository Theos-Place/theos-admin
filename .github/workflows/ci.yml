# CI mínimo (revisión best practices 2026-07-13, B5): typecheck + lint con
# ratchet. Vercel ya corre `next build` (que incluye typecheck) en el deploy,
# pero el lint YA NO corre en el build de Next 16 — sin esta verja, errores
# nuevos de lint llegan a producción sin que nadie los vea.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (ratchet)
        # errores = 0 SIEMPRE. Warnings: 70 es la deuda actual (2026-09-11, 2ª
        # tanda: migrados los 18 set-state-in-effect que eran estado derivado o
        # reset por cambio de prop; quedan 67 set-state-in-effect + 3 purity) —
        # bajar este número conforme se migren casos; NUNCA subirlo.
        run: npx eslint src --max-warnings=70
      - name: Tests
        run: npm test --if-present
