# CI mínimo (revisión best practices 2026-07-13, B5): typecheck + lint con
# ratchet. Vercel ya corre `next build` (que incluye typecheck) en el deploy,
# pero el lint YA NO corre en el build de Next 16 — sin esta verja, errores
# nuevos de lint llegan a producción sin que nadie los vea.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (ratchet)
        # errores = 0 SIEMPRE. Warnings: 54 es la deuda actual — bajar este
        # número conforme se migren casos; NUNCA subirlo.
        #
        # 2026-09-11 (2ª tanda): migrados los 18 set-state-in-effect que eran
        # estado derivado o reset por cambio de prop; quedaron 67 + 3 purity.
        # 2026-10-01: 55 → 54. La verja hizo su trabajo: la precarga del
        # borrador se escribió primero con un efecto, el CI la rechazó por
        # pasarse a 56, y reescribirla como sincronización durante el render
        # —que además evita el parpadeo del formulario vacío— quitó dos.
        # 2026-10-05: 54 → 53. La lista de becas de la ficha pasó a recargarse
        # con un useCallback (BEC-5), y el efecto que ponía `loading` en true
        # al entrar dejó de existir.
        run: npx eslint src --max-warnings=53
      - name: Tests
        run: npm test --if-present
